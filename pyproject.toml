[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on Python syntax, common mistakes, and correctness.
# More opinionated rules can be enabled incrementally after the codebase is formatted.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
